      letter-spacing: 0;

      font-size: 15px;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat,
    .game-button {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);

    .stat {
      padding: 14px 16px;
    }

    .stat strong {
      display: block;
      color: white;
      font-size: 28px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .game-button {
      min-height: 108px;
      padding: 18px;
      color: white;
      text-align: left;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .game-button:hover {
      transform: translateY(-2px);
      border-color: rgba(250, 204, 21, 0.78);
      background: rgba(30, 41, 59, 0.9);
    }

    .game-button b {
      display: block;
      margin-bottom: 8px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .game-button span {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.45;
    }

    #stage {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #020617;
    }

    body.playing #stage {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .stage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(2, 6, 23, 0.94);
    }

    .stage-title {
      min-width: 0;
      overflow: hidden;
      color: #f8fafc;
      font-size: 15px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .stage-actions button {
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 0 12px;
      color: #f8fafc;
      font-weight: 800;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.92);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #020617;
    }

      main {
        width: min(100% - 20px, 1080px);
        padding: 22px 0;
      }

      header {

        align-items: start;
      }

      }

      .stats,

    }

</head>

      "tips": [
        {
          "label": "使役動詞",
          "text": "make / let / have + O (受詞) + V (原形動詞)"
        },
        {
          "label": "if 條件子句",
          "text": "If + S + V (現在簡單式), S + Aux (助動詞) + V (原形動詞)"
        }
      ],
      "notes": [
        {
          "title": "使役動詞 (Causative Verbs)",
          "rule": "這三個使役動詞都有「使、讓」的意思，表示「主動」促使受詞做某事，後面的動詞一律使用「原形動詞」。",
          "description": "make (強迫、要求，語氣最強)；have (交付、吩咐，通常指透過指示讓某人做某事)；let (允許、同意，語氣最弱)。",
          "examples": [
            "The scary movie scene made me cry. (那可怕的電影場景讓我哭了。)",
            "The teacher had the students explore the wild. (老師讓學生們去探索荒野。)",
            "My mom let me add extra cheese to the pizza. (我媽媽讓我給披薩加額外的起司。)"
          ]
        },
        {
          "title": "if 條件子句 (Conditional Clauses)",
          "rule": "以現在簡單式代替未來式",
          "description": "當 if 帶出的子句用來表達「未來可能發生」的真實條件時，if 所在的條件子句要用「現在簡單式」，而主要子句則維持表示未來的「助動詞 + 原形動詞」。",
          "examples": [
            "If Roy finds any wild animals, he will inform the center. (如果 Roy 發現任何野生動物，他會通知中心。)",
            "If you care about your appearance, you can try on these clothes. (如果你在乎你的外表，你可以試穿這些衣服。)"
          ]
        }
      ],

  <script src="config.js"></script>
  <script>
    const lessonData = JSON.parse(document.getElementById('lesson-data').textContent);
    const frame = document.getElementById('game-frame');
    const stage = document.getElementById('stage');
    const stageTitle = document.getElementById('stage-title');
    let activeMessageType = '';

    const GAME_BASE = (window.GAME_BASE || '').replace(/\/+$/, '');
    const gameConfig = {
      miner: {
        label: '單字挖金礦',
        src: GAME_BASE + '/games/miner',
        messageType: 'MINER_DATA',
      },
      bomb: {
        label: '炸彈英文',
        src: GAME_BASE + '/games/bomb',
        messageType: 'BOMB_DATA',
      },
      tank: {
        label: '單字坦克',
        src: GAME_BASE + '/games/tank',
        messageType: 'TANK_DATA',
      },
      ship: {
        label: '海岸狙擊手',
        src: GAME_BASE + '/games/ship',
        messageType: 'SHIP_DATA',
      },
      runner: {
        label: '英文跑酷',
        src: GAME_BASE + '/games/runner',
        messageType: 'RUNNER_DATA',
      },
      battle: {
        label: '英文攻防戰',
        src: GAME_BASE + '/games/battle',
        messageType: 'BATTLE_DATA',
      },
    };

    function buildGamePayload() {
      return {
        unitTitle: lessonData.unitTitle,
        title: lessonData.title,
        school: lessonData.school,
        unitKey: lessonData.unitKey,
        words: (lessonData.words || []).map(item => ({
          word: item.word,
          chinese: item.chinese,
          part_of_speech: item.part_of_speech,
        })),
      };
    }

    function directGameUrl(config) {
      const payload = encodeURIComponent(JSON.stringify(buildGamePayload()));
      return config.src + '?lesson=' + encodeURIComponent(lessonData.unitKey) + '#lessonData=' + payload;
    }

    function postLessonData() {
      if (!frame.contentWindow || !activeMessageType) return;
      frame.contentWindow.postMessage({
        type: activeMessageType,
        payload: lessonData,
      }, '*');
    }

    function requestStageFullscreen() {
      if (document.fullscreenElement || !stage.requestFullscreen) return;
      stage.requestFullscreen().catch(() => {});
    }

    function openGame(gameKey) {
      const config = gameConfig[gameKey];
      if (!config) return;

      if (window.location.protocol === 'file:') {
        window.location.href = directGameUrl(config);
        return;
      }

      activeMessageType = config.messageType;
      stageTitle.textContent = lessonData.title + ' / ' + config.label;
      document.body.classList.add('playing');
      frame.src = config.src + '?lesson=' + encodeURIComponent(lessonData.unitKey);
      requestStageFullscreen();
      [120, 420, 900, 1500].forEach(delay => window.setTimeout(postLessonData, delay));
    }

    function closeGame() {
      activeMessageType = '';
      frame.removeAttribute('src');
      document.body.classList.remove('playing');
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.querySelectorAll('[data-game]').forEach(button => {
      button.addEventListener('click', () => openGame(button.dataset.game));
    });

    frame.addEventListener('load', postLessonData);
    document.getElementById('fullscreen-button').addEventListener('click', requestStageFullscreen);
    document.getElementById('close-button').addEventListener('click', closeGame);
  </script>
